<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>812拉基醫院</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Barlow+Condensed:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Serif+TC:wght@600;900&display=swap">
<style>
/* 版面：左為醫院一樓平面圖（建築圖框、圖簽、指北），兩個題材是兩棟病房大樓，中間是聯合會診中心；右為病歷夾。刻意只做臨床冷白一種外觀。 */
:root{
  color-scheme:light;
  --wall:#eef2f4;      /* 院內牆面：冷白 */
  --sheet:#ffffff;     /* 圖紙與病歷 */
  --ink:#16212b;       /* 墨線與主文字 */
  --mute:#677583;      /* 註記 */
  --line:#d3dbe1;      /* 分隔線 */
  --grid:#e4eaee;      /* 藍圖格線 */
  --a:#1f6f8b;         /* A 棟：青藍 */
  --b:#a8690f;         /* B 棟：琥珀 */
  --br:#71489a;        /* 聯合會診：紫 */
  --up:#cf3535; --down:#21885a;   /* 台股慣例：紅漲綠跌 */
  --t1:#2b5fb4; --t2:#cf3535; --t3:#e0a81c; --t4:#2f9a5d; --t5:#c9d1d7; /* TTAS 檢傷顏色 */
  --serif:"Noto Serif TC","Songti TC",serif;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --num:"Barlow Condensed","Arial Narrow",sans-serif;
  --art:"LXGW WenKai TC","Kaiti TC","DFKai-SB","BiauKai",serif;   /* 圖簽用的手寫楷體 */
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--wall);color:var(--ink);font-family:var(--sans);font-size:13.5px;line-height:1.6}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.num{font-family:var(--num);font-variant-numeric:tabular-nums;letter-spacing:.01em}
.up{color:var(--up)} .down{color:var(--down)} .flat{color:var(--mute)}

.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 400px;grid-template-rows:auto auto minmax(0,1fr);gap:14px 18px;
  padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));padding-block:14px 18px}

/* ---------- 院名招牌 ---------- */
.mast{grid-column:1/-1;display:grid;grid-template-columns:auto minmax(0,1fr) auto;grid-template-areas:"sign depts tri";align-items:center;gap:12px 28px}
.sign{grid-area:sign} .mast .depts{grid-area:depts} .triage{grid-area:tri}
@media (max-width:1360px){
  .mast{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"sign tri" "depts depts";row-gap:12px}
  .mast .depts{justify-content:flex-start;padding-top:12px;border-top:1px solid var(--line)}
  .mast .tools{margin-left:auto}
}
@media (max-width:640px){
  .mast{grid-template-columns:minmax(0,1fr);grid-template-areas:"sign" "tri" "depts"}
  .triage{justify-self:stretch;justify-content:space-between}
  .mast .depts{gap:8px}
  .dept{flex:1 1 140px;min-width:0} .dbtn{width:100%} .dbtn .body{flex:1;min-width:0}
  .amp{display:none}
  .mast .tools{margin-left:0;width:100%;justify-content:space-between}
}
.sign{display:flex;align-items:center;gap:14px}
.cross{width:40px;height:40px;background:var(--ink);display:grid;place-items:center;border-radius:4px}
.cross i{position:relative;width:20px;height:20px}
.cross i::before,.cross i::after{content:"";position:absolute;background:#fff;border-radius:1px}
.cross i::before{left:7px;top:0;width:6px;height:20px} .cross i::after{top:7px;left:0;width:20px;height:6px}
.sign h1{margin:0;font-family:var(--serif);font-weight:900;font-size:24px;letter-spacing:.12em;line-height:1.15}
.sign p{margin:2px 0 0;font-size:12px;color:var(--mute)}
.sign p .num{font-size:15px;color:var(--ink)}
.depts{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap}
.dept{position:relative}
.dbtn{display:flex;align-items:stretch;border-radius:4px;overflow:hidden;background:var(--sheet);border:1px solid var(--line);box-shadow:0 1px 0 rgba(22,33,43,.04)}
.dbtn .tag{display:grid;place-items:center;width:34px;color:#fff;font-family:var(--num);font-weight:700;font-size:15px}
.dbtn .body{display:flex;flex-direction:column;align-items:flex-start;padding:4px 12px 5px 10px;line-height:1.25}
.dbtn .body small{font-size:10.5px;color:var(--mute)}
.dbtn .body b{font-size:15px;font-weight:700}
.dbtn .car{display:grid;place-items:center;padding:0 10px;color:var(--mute);font-size:10px;border-left:1px solid var(--line)}
.dept.A .tag{background:var(--a)} .dept.B .tag{background:var(--b)}
.dbtn:hover{border-color:var(--mute)}
.amp{font-family:var(--num);font-size:20px;color:var(--mute)}
.menu{position:absolute;top:calc(100% + 6px);left:0;z-index:30;width:270px;background:var(--sheet);border:1px solid var(--line);border-radius:6px;padding:6px 0;box-shadow:0 18px 40px rgba(22,33,43,.16)}
.menu button{display:grid;grid-template-columns:minmax(0,1fr) 26px 60px;gap:10px;align-items:center;width:100%;text-align:left;padding:6px 14px;font-size:13px}
.menu button:hover{background:var(--wall)}
.menu button[aria-selected="true"]{font-weight:700}
.menu button[disabled]{opacity:.35;cursor:default}
.menu .num{text-align:right;color:var(--mute);font-size:15px}
.menu i{display:block;height:3px;background:var(--grid);border-radius:2px} .menu i b{display:block;height:3px;background:var(--mute);border-radius:2px}
.tools{display:flex;gap:4px;margin-left:6px}
.tool{font-size:12.5px;color:var(--mute);padding:5px 9px;border-radius:4px}
.tool:hover{background:var(--sheet);color:var(--ink)}
.triage{display:flex;align-items:center;gap:14px;background:var(--sheet);border:1px solid var(--line);border-radius:6px;padding:8px 14px}
.triage .lv{display:flex;flex-direction:column;line-height:1.25}
.triage .lv small{font-size:10.5px;color:var(--mute)}
.triage .lv b{font-size:15px}
.tbar{display:flex;gap:3px;margin-top:4px}
.tbar i{width:16px;height:5px;border-radius:1px;opacity:.22}
.tbar i.on{opacity:1}
.triage .score{font-family:var(--num);font-weight:600;font-size:42px;line-height:.9}
.triage .score small{font-size:15px;color:var(--mute);font-weight:500}

/* ---------- 平面圖 ---------- */
.plan{position:relative;min-height:0;background:var(--sheet);border:1px solid var(--line);border-radius:6px;overflow:hidden}
canvas{display:block;width:100%;height:100%;touch-action:manipulation}
.ctrl{position:absolute;top:22px;right:24px;display:flex;gap:4px;background:var(--sheet);border:1px solid var(--line);border-radius:5px;padding:3px}
.ctrl button{min-width:30px;height:28px;padding:0 8px;border-radius:3px;font-size:12.5px;color:var(--mute)}
.ctrl button:hover{background:var(--wall);color:var(--ink)}
.legend{position:absolute;top:62px;right:24px;width:236px;background:var(--sheet);border:1px solid var(--line);border-radius:6px;padding:12px 14px;font-size:12px;box-shadow:0 12px 30px rgba(22,33,43,.12);display:grid;gap:7px}
.legend b{font-size:12.5px}
.legend span{display:flex;align-items:center;gap:8px;color:var(--mute)}
.legend i{flex:none;width:12px;height:12px;border-radius:50%;border:2px solid}
.legend i.bed{border-radius:2px;width:16px;height:9px}
.course{position:absolute;left:30px;bottom:20px;width:min(560px,calc(100% - 300px));display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:center;background:rgba(255,255,255,.92);padding:6px 12px 4px 6px;border:1px solid var(--line);border-radius:5px}
.play{width:28px;height:28px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-size:10px}
.course input{width:100%;margin:0;accent-color:var(--ink)}
.ticks{display:flex;justify-content:space-between;font-family:var(--num);font-size:13px;color:var(--mute);margin-top:-2px}
.ticks span.on{color:var(--ink);font-weight:600}
#tip{position:absolute;pointer-events:none;width:max-content;max-width:280px;background:var(--ink);color:#fff;border-radius:5px;padding:8px 11px;font-size:12px;box-shadow:0 10px 24px rgba(22,33,43,.25)}
#tip .k{color:#aab7c2;font-size:11px} #tip b{display:block;font-size:13px;line-height:1.45;margin-top:1px}
#tip .up{color:#ff8a8a} #tip .down{color:#6fe0a8}
.toast{position:absolute;top:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:999px;padding:6px 16px;font-size:12px}

/* 識別證／床頭卡 */
.card{position:absolute;width:292px;background:var(--sheet);border:1px solid var(--line);border-radius:8px;overflow:hidden;box-shadow:0 22px 50px rgba(22,33,43,.2),0 2px 6px rgba(22,33,43,.08);opacity:0;transform:translateY(6px) scale(.98);transition:opacity .22s ease,transform .22s ease}
.card.in{opacity:1;transform:none}
.card .band{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 12px;color:#fff;font-size:12px}
.card .band b{font-size:13px;letter-spacing:.06em}
.card .band button{color:#fff;opacity:.85;font-size:17px;line-height:1}
.card .inner{padding:12px 14px 14px;display:grid;gap:9px}
.card .idrow{display:grid;grid-template-columns:52px minmax(0,1fr);gap:12px;align-items:center}
.card .ph{width:52px;height:52px;border-radius:6px;background:var(--wall);display:grid;place-items:center}
.card .role{font-size:11px;color:var(--mute)}
.card .nm{font-family:var(--serif);font-weight:900;font-size:17px;line-height:1.3}
.card .dx{font-family:var(--serif);font-weight:600;font-size:14px;line-height:1.55;border-left:3px solid var(--line);padding-left:10px}
.card .meta{font-size:11.5px;color:var(--mute)}
.card .pts{display:flex;flex-wrap:wrap;gap:6px}
.card .pt{display:flex;align-items:baseline;gap:6px;border:1px solid var(--line);border-radius:4px;padding:2px 8px;font-size:12px}
.card .pt:hover{border-color:var(--ink)}
.card .pt .num{font-size:14px}
.card .bed{display:flex;align-items:baseline;gap:10px}
.card .bed .no{font-family:var(--num);font-weight:700;font-size:40px;line-height:.9}
.card .vit{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.card .vit div{padding:6px 10px}
.card .vit div+div{border-left:1px solid var(--line)}
.card .vit small{display:block;font-size:10.5px;color:var(--mute)}
.card .vit .num{font-size:22px;font-weight:600;line-height:1.1}
.card .docs{display:grid;gap:2px}
.card .docs button{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px;text-align:left;font-size:12.5px;padding:4px 0;border-top:1px solid var(--grid)}
.card .docs button:first-child{border-top:0}
.card .docs button:hover span:last-child{text-decoration:underline}
.chip{display:inline-block;font-size:10.5px;font-weight:700;color:#fff;border-radius:3px;padding:0 6px;line-height:18px;white-space:nowrap}

/* ---------- 病歷夾 ---------- */
.chart{min-height:0;display:flex;flex-direction:column;background:var(--sheet);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);background:var(--wall);padding:4px;gap:4px;border-bottom:1px solid var(--line)}
.tabs button{padding:7px 0;border-radius:4px;color:var(--mute);font-weight:500}
.tabs button[aria-selected="true"]{background:var(--sheet);color:var(--ink);font-weight:700;box-shadow:0 1px 2px rgba(22,33,43,.1)}
.pane{flex:1;min-height:0;overflow:auto;padding:16px 18px;display:flex;flex-direction:column;gap:24px}
h2{margin:0 0 4px;font-family:var(--serif);font-weight:900;font-size:16px;letter-spacing:.06em}
.note{margin:0 0 10px;color:var(--mute);font-size:12px}
.comp{display:grid;grid-template-columns:6.5em minmax(0,1fr) 3em;gap:8px 12px;align-items:center;font-size:12.5px}
.comp .bar{height:6px;background:var(--grid);border-radius:3px;overflow:hidden}
.comp .bar b{display:block;height:6px;background:var(--ink)}
.comp .num{text-align:right;font-size:16px;font-weight:600}
.row{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;width:100%;text-align:left;padding:10px 0;border-top:1px solid var(--grid)}
.row:first-of-type{border-top:0;padding-top:2px}
.row:hover .t{text-decoration:underline}
.row .t{font-family:var(--serif);font-weight:600;font-size:14px;line-height:1.5}
.row .m{font-size:11.5px;color:var(--mute);margin-top:2px}
.mini{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:11px;font-weight:700;margin-top:2px}
table{width:100%;border-collapse:collapse}
th{font-weight:500;font-size:11px;color:var(--mute);text-align:left;padding:0 0 6px;border-bottom:1px solid var(--line)}
td{padding:7px 0;border-bottom:1px solid var(--grid);font-size:13px;vertical-align:middle}
tr.pr{cursor:pointer} tr.pr:hover td{background:var(--wall)}
td .code{font-family:var(--num);font-weight:600;color:var(--mute);font-size:14px;margin-right:6px}
.r{text-align:right}
td.v{font-family:var(--num);font-size:16px;font-weight:600;text-align:right;white-space:nowrap}
.abw{display:flex;align-items:center;justify-content:center;gap:2px;width:62px}
.abw i{height:6px;border-radius:1px} .abw .l{background:var(--a);margin-left:auto} .abw .rr{background:var(--b);margin-right:auto}
.dxm{font-size:11px;font-weight:700;border-radius:3px;padding:1px 6px;white-space:nowrap}
.dxm.ok{background:#e8f1ec;color:var(--down)} .dxm.ok.pos{background:#f8e9e9;color:var(--up)}
.dxm.bad{background:#fff3d6;color:#8a5a00}
.dxm.na{background:var(--wall);color:var(--mute);font-weight:500}
.ward{display:grid;grid-template-columns:minmax(0,1fr) 22px 6.2em 22px minmax(0,1fr);gap:6px 8px;align-items:center;font-size:12px}
.ward .l{display:flex;justify-content:flex-end} .ward .l i{height:8px;background:var(--a);border-radius:2px 0 0 2px}
.ward .rr i{display:block;height:8px;background:var(--b);border-radius:0 2px 2px 0}
.ward .nm{text-align:center;color:var(--ink)}
.ward .num{font-size:14px;color:var(--mute)} .ward .na{text-align:right}
.ref{display:grid;grid-template-columns:30px minmax(0,1fr);gap:10px;width:100%;text-align:left;padding:12px 10px;border:1px solid var(--line);border-radius:6px}
.ref[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 3px 0 0 var(--br)}
.ref .no{font-family:var(--num);font-weight:700;font-size:24px;line-height:1;color:var(--mute)}
.ref[aria-pressed="true"] .no{color:var(--ink)}
.ref .kd{font-size:11.5px;color:var(--mute)} .ref .kd .num{font-size:14px;color:var(--ink);font-weight:600;margin-left:4px}
.ref .pth{font-size:13px;line-height:1.75;margin-top:2px}
.ref .pth .n{font-weight:700} .ref .pth .A{color:var(--a)} .ref .pth .B{color:var(--b)} .ref .pth .AB{color:var(--br)}
.ref .pth .ar{color:var(--mute);margin:0 4px}
.ref .why{font-size:12px;color:var(--mute);margin-top:2px}
.refs{display:grid;gap:8px}
.board{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.board div{padding:8px 0;text-align:center}
.board div+div{border-left:1px solid var(--line)}
.board .num{display:block;font-size:28px;font-weight:600;line-height:1}
.board span{font-size:11px;color:var(--mute)}
.q{border:1px solid var(--line);border-radius:8px;overflow:hidden}
.q .hd{display:flex;align-items:baseline;gap:10px;padding:12px 14px;background:var(--wall)}
.q .hd b{font-family:var(--serif);font-weight:900;font-size:22px}
.q .hd .num{font-size:18px;color:var(--mute)}
.q .hd span{font-size:12px;color:var(--mute)}
.q ul{list-style:none;margin:0;padding:12px 14px;display:grid;gap:8px}
.q li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px;font-size:13px;line-height:1.5}
.bets{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 14px 14px}
.bet{border-radius:6px;padding:11px 0;font-weight:700;font-size:15px;letter-spacing:.12em;color:#fff}
.bet.u{background:var(--up)} .bet.d{background:var(--down)}
.bet:disabled{opacity:.3;cursor:default}
.reveal{padding:12px 14px 14px;border-top:1px solid var(--line);font-size:13px;color:var(--mute)}
.reveal .num{font-size:34px;font-weight:600;margin-right:6px}
.reveal p{margin:4px 0 12px;color:var(--ink)}
.cta{background:var(--ink);color:#fff;border-radius:6px;padding:9px 20px;font-weight:700;letter-spacing:.08em}
.cta:hover{background:#2b3a48}
.intro p{margin:0 0 10px;font-size:13.5px;line-height:1.8;max-width:36em}

dialog{background:var(--sheet);color:var(--ink);border:1px solid var(--line);border-radius:10px;width:min(620px,calc(100vw - 32px));padding:20px 22px}
dialog::backdrop{background:rgba(22,33,43,.45)}
textarea{width:100%;height:200px;border:1px solid var(--line);border-radius:6px;padding:10px;font-size:13px;line-height:1.7;resize:vertical;background:var(--wall)}
.drow{display:flex;gap:10px;justify-content:flex-end;align-items:center;flex-wrap:wrap;margin-top:12px}
#impMsg{margin-right:auto;font-size:12px;color:var(--mute)} #impMsg.err{color:var(--up)}

/* 叫號跑馬燈：醫院候診區的 LED 叫號板 */
.ticker{grid-column:1/-1;display:grid;grid-template-columns:auto minmax(0,1fr);align-items:stretch;background:#121a22;border-radius:6px;overflow:hidden;height:36px}
.tk-lab{display:flex;align-items:center;gap:8px;padding:0 14px;background:#1d2833;color:#ffcf6b;font-weight:700;font-size:12.5px;letter-spacing:.2em}
.tk-lab i{width:7px;height:7px;border-radius:50%;background:#ff5a4f;box-shadow:0 0 8px #ff5a4f;animation:blink 1.4s steps(2) infinite}
@keyframes blink{50%{opacity:.25}}
.tk-win{overflow:hidden;position:relative;mask-image:linear-gradient(90deg,transparent,#000 3%,#000 97%,transparent)}
.tk-run{display:flex;width:max-content;height:100%;align-items:center;animation:tk var(--dur,80s) linear infinite}
.tk-win:hover .tk-run{animation-play-state:paused}
@keyframes tk{to{transform:translateX(-50%)}}
.tk-i{display:flex;align-items:center;gap:8px;padding:0 22px;color:#ffe7b3;font-size:13px;white-space:nowrap;font-family:var(--sans);border-right:1px solid #2a3642;height:100%}
.tk-i:hover{color:#fff;background:#1d2833}
.tk-i .t{font-family:var(--num);font-size:14px;color:#8fa1b0}
.tk-i b{width:6px;height:6px;border-radius:50%;flex:none}
@media (prefers-reduced-motion:reduce){.tk-run{animation:none}.tk-win{overflow-x:auto}}

/* 院務總覽 */
.kpi{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.kpi>div{padding:10px 12px}
.kpi>div+div{border-left:1px solid var(--line)}
.kpi small{display:block;font-size:11px;color:var(--mute)}
.kpi .num{font-size:26px;font-weight:600;line-height:1.15}
.kpi .sub{display:block;font-size:11.5px;color:var(--mute);line-height:1.4}
.th-row{display:grid;grid-template-columns:minmax(0,1fr) 74px 64px auto;gap:10px;align-items:center;padding:7px 0;border-top:1px solid var(--grid);font-size:13px}
.th-row:first-of-type{border-top:0}
.th-row .nm{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.th-row .nm .num{font-weight:500;color:var(--mute);margin-left:6px;font-size:14px}
.bal{display:flex;height:6px;border-radius:3px;overflow:hidden;background:var(--grid)}
.bal i{display:block;height:6px}
.th-row .ab{display:flex;gap:3px}
.th-row .ab button{width:24px;height:22px;border-radius:3px;font-family:var(--num);font-weight:700;font-size:12px;border:1px solid var(--line);color:var(--mute)}
.th-row .ab button.a:hover,.th-row .ab button.a.on{background:var(--a);color:#fff;border-color:var(--a)}
.th-row .ab button.b:hover,.th-row .ab button.b.on{background:var(--b);color:#fff;border-color:var(--b)}
.mx{display:grid;gap:2px;font-size:10.5px}
.mx .h{color:var(--ink);display:flex;align-items:flex-end;justify-content:center;padding-bottom:2px;font-family:var(--num);font-weight:700;font-size:12px}
.mx .rh{color:var(--mute);display:flex;align-items:center;justify-content:flex-end;padding-right:4px;white-space:nowrap;overflow:hidden}
.mx button{aspect-ratio:1;border-radius:2px;font-family:var(--num);font-size:11px;font-weight:600;color:var(--ink);max-width:100%}
.mx button:hover{outline:2px solid var(--ink);outline-offset:-1px}
.mx button.cur{outline:2px solid var(--br);outline-offset:-1px}
.mx .dg{background:var(--wall);border-radius:2px}
.mxkey{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--mute);margin-top:8px}
.mxkey i{display:block;width:90px;height:6px;border-radius:3px;background:linear-gradient(90deg,#f3eef8,var(--br))}
.movers{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mv h3{margin:0 0 4px;font-size:12.5px;display:flex;align-items:center;gap:6px}
.mv h3 i{width:8px;height:8px;border-radius:50%}
.mv button{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px;width:100%;text-align:left;padding:5px 0;border-top:1px solid var(--grid);font-size:12.5px}
.mv button:hover .n{text-decoration:underline}
.mv .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mv .num{font-size:14px;font-weight:600}
.spark{display:block;width:100%;height:auto}
.card .ecg{border:1px solid var(--line);border-radius:6px;padding:6px 8px 4px;background:#fbfcfc}
.card .ecg .hd{display:flex;justify-content:space-between;font-size:10.5px;color:var(--mute)}
@media (max-width:1060px){
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto 72vh auto;height:auto}
  .pane{overflow:visible}
}
@media (max-width:640px){
  .app{grid-template-rows:auto auto 165vh auto}
  .course{left:12px;right:12px;width:auto;top:54px;bottom:auto}
  .ctrl{top:12px;right:12px}
  .legend{top:52px;right:12px}
  .card{width:auto}
}
@media (prefers-reduced-motion:reduce){.card{transition:none}}
.legend[hidden],.card[hidden],#tip[hidden],.toast[hidden]{display:none}
</style>

<style>[hidden]{display:none!important}body{margin:0}</style>
</head>
<body>
<div class="app">
  <header class="mast">
    <div class="sign">
      <div class="cross" aria-hidden="true"><i></i></div>
      <div><h1>812拉基醫院</h1><p>加權指數 <span class="num" id="taiex"></span>　<span id="asof"></span></p></div>
    </div>
    <div class="depts">
      <div class="dept A" id="selA"><button class="dbtn" aria-haspopup="listbox" aria-expanded="false"><span class="tag">A</span><span class="body"><small>A 棟</small><b class="v"></b></span><span class="car">▾</span></button></div>
      <span class="amp">×</span>
      <div class="dept B" id="selB"><button class="dbtn" aria-haspopup="listbox" aria-expanded="false"><span class="tag">B</span><span class="body"><small>B 棟</small><b class="v"></b></span><span class="car">▾</span></button></div>
      <div class="tools">
        <button class="tool" id="swap">對調兩棟</button>
        <button class="tool" id="dice">隨機會診</button>
        <button class="tool" id="impBtn">新增新聞</button>
      </div>
    </div>
    <div class="triage" title="依台灣急診五級檢傷（TTAS）呈現兩科會診強度：級數越小越緊密">
      <div class="lv"><small>會診檢傷</small><b id="lvName"></b><div class="tbar" id="tbar"></div></div>
      <div class="score" id="idx"></div>
    </div>
  </header>
  <div class="ticker" aria-label="今日新聞叫號">
    <span class="tk-lab"><i></i>叫號</span>
    <div class="tk-win" id="tkWin"><div class="tk-run" id="tkRun"></div></div>
  </div>

  <main class="plan" id="plate">
    <canvas id="cv" aria-label="醫院平面圖：A 棟與 B 棟是兩個題材，醫師代表新聞，病床代表個股，中間是聯合會診中心"></canvas>
    <div class="ctrl">
      <button id="legBtn" aria-expanded="false">圖例</button>
      <button id="zout" aria-label="縮小">－</button>
      <button id="zin" aria-label="放大">＋</button>
      <button id="zreset">全院</button>
    </div>
    <div class="legend" id="legend" hidden>
      <b>怎麼看這張平面圖</b>
      <span><i style="border-color:var(--a);background:#fff"></i>醫師＝一則新聞，職級越高新聞熱度越高</span>
      <span><i style="border-color:var(--br);background:#fff"></i>紫框醫師：同時談到兩科的會診新聞</span>
      <span><i class="bed" style="border-color:var(--up);background:#fbe9e9"></i>病床＝一檔個股，紅為最新收盤好轉（上漲）</span>
      <span><i class="bed" style="border-color:var(--down);background:#e6f3ec"></i>綠為惡化（下跌），灰為未量測</span>
      <span>醫師右上角 ＋／－：新聞利多或利空</span>
      <span>走廊上的心電波：兩科會診的往來，越強越密</span>
    </div>
    <div class="course">
      <button class="play" id="play" aria-label="依日期回放病程">▶</button>
      <div><input type="range" id="range" min="0" max="0" value="0" aria-label="病程截至日期"><div class="ticks" id="ticks"></div></div>
    </div>
    <div class="card" id="card" hidden></div>
    <div id="tip" hidden></div>
    <div class="toast" id="toast" hidden></div>
  </main>

  <aside class="chart">
    <div class="tabs" role="tablist">
      <button role="tab" aria-selected="true" data-tab="ovw">院務總覽</button>
      <button role="tab" aria-selected="false" data-tab="obs">會診紀錄</button>
      <button role="tab" aria-selected="false" data-tab="chain">轉診路徑</button>
      <button role="tab" aria-selected="false" data-tab="quiz">預後挑戰</button>
    </div>
    <div class="pane" id="leaf"></div>
  </aside>
</div>

<dialog id="dlg">
  <h2>新增新聞，自動分科與配床</h2>
  <p class="note">一行一則。開頭可加日期（例如 10/27），結尾加「+」或「-」標示利多利空。系統會用上市櫃公司名稱、常見簡稱與族群名（如「重電四雄」）找出個股病人，並依題材詞庫分到各科。</p>
  <textarea id="impText" spellcheck="false" placeholder="10/27 輝達擴大 CPO 投資，日月光投控與京元電受惠 +&#10;10/27 長鑫擴產進度超前，南亞科、華邦電承壓 -"></textarea>
  <div class="drow">
    <span id="impMsg"></span>
    <button class="tool" id="impCancel">取消</button>
    <button class="tool" id="impAdd">加入現有新聞</button>
    <button class="cta" id="impReplace">取代全部新聞</button>
  </div>
</dialog>

<script>
// 啟動：先載入每日更新的 data.json 與共用詞庫，再執行主程式
(async()=>{
  const plate=document.getElementById("plate");
  try{
    const [d,lex]=await Promise.all([fetch("data.json?v="+Date.now()).then(r=>{if(!r.ok)throw new Error("data.json "+r.status);return r.json();}),
                                     fetch("lexicon.json?v="+Date.now()).then(r=>r.json())]);
    window.HIST=await fetch("history.json?v="+Date.now()).then(r=>r.ok?r.json():null).catch(()=>null);
    setLexicon(lex);
    Object.assign(window,{DATA_ASOF:d.asof,DATA_UPDATED:d.updated,DATA_NOTES:d.notes||[],TAIEX:d.taiex,INDS:d.inds,MKS:d.mks,UNI_RAW:d.uni_raw,QUOTES:d.quotes,NEWS:d.news});
    const s=document.createElement("script");s.textContent=document.getElementById("app").textContent;document.body.appendChild(s);
  }catch(e){plate.innerHTML='<p style="padding:40px;color:#677583">資料載入失敗：'+e.message+'。請確認 docs/data.json 存在，或稍後重新整理。</p>';}
})();
</script>

let EVENTS=[],DATES=[];
const state={A:"AI伺服器",B:"電力電網",upto:0,tab:"ovw",sel:null,hover:null,chain:0,quiz:null};
function ingest(list){
  const seq={};
  EVENTS=list.map((n,i)=>{const r=matchText(n.t+" "+(n.s||""),MATCH),o=dateOrd(n.d);seq[o]=(seq[o]||0)+1;
    return {...n,id:"e"+i,o,cat:"D"+(o===1000?"10":String(o%100).padStart(2,"0"))+"-"+String(seq[o]).padStart(2,"0"),
      codes:r.codes.map(x=>x.c),how:Object.fromEntries(r.codes.map(x=>[x.c,x.how])),themes:r.themes,heat:n.heat||3,sent:n.sent||0};});
  DATES=[...new Set(EVENTS.map(e=>e.o))].sort((a,b)=>a-b);
  $("range").max=DATES.length-1;$("range").value=DATES.length-1;state.upto=DATES.at(-1);
}

/* ================= 分析 ================= */
function themeCounts(){const m={};EVENTS.filter(e=>e.o<=state.upto).forEach(e=>e.themes.forEach(t=>m[t]=(m[t]||0)+1));return m;}
function analyse(A=state.A,B=state.B){
  const vis=EVENTS.filter(e=>e.o<=state.upto);
  vis.forEach(e=>{const a=e.themes.includes(A),b=e.themes.includes(B);e.g=a&&b?"ab":a?"a":b?"b":"o";});
  const inA=vis.filter(e=>e.g==="a"),inB=vis.filter(e=>e.g==="b"),inAB=vis.filter(e=>e.g==="ab");
  const st={};
  vis.forEach(e=>{if(e.g==="o")return;e.codes.forEach(c=>{
    const s=st[c]||(st[c]={code:c,name:UNI[c]?.[1]||c,mk:UNI[c]?.[2]||"",ind:UNI[c]?.[3]||"",a:0,b:0,ab:0,net:0,heat:0,evs:[]});
    if(e.g!=="b")s.a++;if(e.g!=="a")s.b++;if(e.g==="ab")s.ab++;s.net+=e.sent*e.heat;s.heat+=e.heat;s.evs.push(e);});});
  const stocks=Object.values(st).map(s=>{
    s.side=s.a&&s.b?"both":s.a?"a":"b";
    s.score=Math.sqrt(s.a*s.b)*2+s.ab*1.5+(s.a+s.b)*.3+s.heat*.08;
    s.q=quote(s.code);
    s.react=!s.q||s.q.chg===0||s.net===0?"na":Math.sign(s.q.chg)===Math.sign(s.net)?"ok":"div";
    return s;}).sort((x,y)=>y.score-x.score);
  const SA=new Set([...inA,...inAB].flatMap(e=>e.codes)),SB=new Set([...inB,...inAB].flatMap(e=>e.codes));
  const IA=new Set([...SA].map(c=>UNI[c]?.[3]).filter(Boolean)),IB=new Set([...SB].map(c=>UNI[c]?.[3]).filter(Boolean));
  const jac=(x,y)=>{const u=new Set([...x,...y]).size;return u?[...x].filter(v=>y.has(v)).length/u:0;};
  const union=inA.length+inB.length+inAB.length;
  const J=union?inAB.length/union:0,Js=jac(SA,SB),Ji=jac(IA,IB);
  const links=[];
  inA.forEach(x=>inB.forEach(y=>{
    const shS=x.codes.filter(c=>y.codes.includes(c));
    const ix=new Set(x.codes.map(c=>UNI[c]?.[3]));
    const shI=[...new Set(y.codes.map(c=>UNI[c]?.[3]))].filter(i=>i&&ix.has(i)&&!shS.some(c=>UNI[c]?.[3]===i));
    const shT=x.themes.filter(t=>t!==A&&t!==B&&y.themes.includes(t));
    const tf=Math.exp(-Math.abs(dayNum(x.o)-dayNum(y.o))/6);
    const w=(shS.length+shI.length*.35+shT.length*.5)*(.6+.4*tf);
    if(w>0)links.push({x,y,w,shS,shI,shT});}));
  const linkD=inA.length&&inB.length?links.length/(inA.length*inB.length):0;
  const idx=Math.round(100*(1-Math.exp(-(J*1.6+Js*1.2+Ji*.4+linkD*.6))));
  const wards={};stocks.forEach(s=>{const w=wards[s.ind]||(wards[s.ind]={ind:s.ind,a:0,b:0});if(s.a)w.a++;if(s.b)w.b++;});
  const chains=[];
  stocks.filter(s=>s.side==="both").forEach(s=>{
    const ea=s.evs.filter(e=>e.g!=="b").sort((p,q)=>q.heat-p.heat)[0],eb=s.evs.filter(e=>e.g!=="a"&&e!==ea).sort((p,q)=>q.heat-p.heat)[0];
    if(ea&&eb)chains.push({kind:"共同照護病人",nodes:[ea.id,"s"+s.code,eb.id],w:s.score*1.2,why:`${s.name}同時被兩科醫師點名，共 ${s.a+s.b} 則新聞`});
    else if(ea&&ea.g==="ab")chains.push({kind:"聯合會診",nodes:[ea.id,"s"+s.code],w:s.score,why:`同一位會診醫師橫跨兩科，直接收治${s.name}`});});

      return `<button class="${cur?"cur":""}" data-pair="${esc(a)}|${esc(b)}" title="${esc(a)} × ${esc(b)}：${v}" style="background:color-mix(in srgb,${COL.br} ${Math.round(v*.9)}%,#f6f3f9);color:${v>55?"#fff":COL.ink}">${v||""}</button>`;}).join("")).join("")}</div>
    <div class="mxkey">弱<i></i>強</div></section>
  <section><h2>病危通知與好轉出院</h2><p class="note">近兩天新聞點名的股票中，${ASOF_MD} 跌最多與漲最多的</p>
    <div class="movers"><div class="mv"><h3><i style="background:var(--down)"></i>病危通知</h3>${down.filter(x=>x.q.chg<0).map(mvRow).join("")||'<p class="note">沒有下跌的病人</p>'}</div>
    <div class="mv"><h3><i style="background:var(--up)"></i>好轉出院</h3>${up.map(mvRow).join("")||'<p class="note">沒有上漲的病人</p>'}</div></div></section>`;}
// 跳到某則新聞或某檔股票：若不在目前兩科，自動換成它所屬的科別
function jumpTo(id){
  if(state.upto!==DATES.at(-1)){state.upto=DATES.at(-1);$("range").value=DATES.length-1;}
  let n=nodeMap[id];
  if(!n){
    const tc={};
    if(id.startsWith("e")){const e=EVENTS.find(x=>x.id===id);(e?.themes||[]).forEach(t=>tc[t]=(tc[t]||0)+2);}
    else EVENTS.filter(e=>e.codes.includes(id.slice(1))).forEach(e=>e.themes.forEach(t=>tc[t]=(tc[t]||0)+e.heat));
    const ts=Object.keys(tc).sort((a,b)=>tc[b]-tc[a]);
    if(!ts.length){toast("這則新聞沒有對應的科別，無法顯示在平面圖");return;}
    if(!ts.includes(state.A)&&!ts.includes(state.B)){state.A=ts[0];
      if(ts[1])state.B=ts[1];else if(state.B===state.A)state.B=Object.keys(themeCounts()).find(t=>t!==state.A)||state.B;}
    keep={};refresh();n=nodeMap[id];
  }
  if(n)select(n);else toast("在目前的日期範圍找不到這個項目");
}
function renderTicker(){
  const last=DATES.filter(o=>o!==1000).at(-1);
  const items=EVENTS.filter(e=>e.o===last).sort((a,b)=>b.heat-a.heat).slice(0,16);
  if(!items.length){$("tkRun").innerHTML="";return;}
  const one=items.map(e=>`<button class="tk-i" data-ev="${e.id}"><span class="t">${fmtDate(e.o)}</span><b style="background:${e.sent>0?"#ff6b6b":e.sent<0?"#3fd18c":"#8fa1b0"}"></b>${esc(e.t)}</button>`).join("");
  $("tkRun").innerHTML=one+one;$("tkRun").style.setProperty("--dur",Math.max(40,items.length*7)+"s");
  $("tkRun").querySelectorAll("[data-ev]").forEach(b=>b.onclick=()=>jumpTo(b.dataset.ev));
}
function render(){
  header();const p=$("leaf");
  p.innerHTML=state.tab==="ovw"?ovwHTML():state.tab==="obs"?obsHTML():state.tab==="chain"?chainHTML():quizHTML();
  p.querySelectorAll("[data-id]").forEach(el=>{
    el.onmouseenter=()=>{state.hover=nodeMap[el.dataset.id]||null;};el.onmouseleave=()=>{state.hover=null;};
    el.onclick=()=>{const n=nodeMap[el.dataset.id];if(n)select(n);};});
  p.querySelectorAll("[data-chain]").forEach(el=>el.onclick=()=>{state.chain=+el.dataset.chain;const c=R.chains[state.chain];state.sel=null;openCard(null);flyToNodes(c.nodes.map(id=>nodeMap[id]));render();});
  p.querySelectorAll("[data-bet]").forEach(el=>el.onclick=()=>bet(+el.dataset.bet));
  p.querySelectorAll("[data-set]").forEach(el=>el.onclick=e=>{e.stopPropagation();const [slot,t]=el.dataset.set.split("|");const other=slot==="A"?state.B:state.A;
    if(t===other){[state.A,state.B]=[state.B,state.A];}else state[slot]=t;keep={};refresh();});
  p.querySelectorAll("[data-pair]").forEach(el=>el.onclick=()=>{const [a,b]=el.dataset.pair.split("|");state.A=a;state.B=b;keep={};refresh();toast(`${dept(a)} × ${dept(b)}`);});
  p.querySelectorAll("[data-jump]").forEach(el=>el.onclick=()=>jumpTo(el.dataset.jump));
  $("qStart")&&($("qStart").onclick=newQuiz);
  $("qNext")&&($("qNext").onclick=()=>{const Q=state.quiz;Q.i++;Q.ans=null;const s=Q.pool[Q.i];const n=s?nodeMap["s"+s.code]:null;state.sel=n;openCard(n);if(n)focusNode(n);else resetView();render();});
}
function setTab(t){state.tab=t;document.querySelectorAll("[data-tab]").forEach(b=>b.setAttribute("aria-selected",b.dataset.tab===t));
  if(t==="chain"&&R.chains[state.chain]){state.sel=null;openCard(null);flyToNodes(R.chains[state.chain].nodes.map(id=>nodeMap[id]));}
  if(t!=="quiz"&&state.quiz){state.quiz=null;}
  render();}
function refresh(){state.sel=null;state.chain=0;state.quiz=null;openCard(null);build();resetView();render();}
document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>setTab(b.dataset.tab));
$("swap").onclick=()=>{[state.A,state.B]=[state.B,state.A];Object.values(keep).forEach(k=>{if(vert())k.y=H-k.y;else k.x=W-k.x;});refresh();};
$("dice").onclick=()=>{const tc=themeCounts(),ts=Object.keys(tc).filter(t=>tc[t]>=2);let best=null;
  for(let i=0;i<60;i++){const a=ts[Math.random()*ts.length|0],b=ts[Math.random()*ts.length|0];if(a===b||(a===state.A&&b===state.B))continue;const r=analysePair(a,b);if(r.idx>=20){best=[a,b,r.idx];break;}}
  if(!best){toast("沒找到有會診關係的兩科，新增更多新聞再試");return;}
  state.A=best[0];state.B=best[1];keep={};refresh();toast(`${dept(best[0])} 與 ${dept(best[1])}，會診強度 ${best[2]}`);};
$("range").oninput=e=>{state.upto=DATES[+e.target.value];refresh();};
let playing=null;
$("play").onclick=()=>{if(playing){clearInterval(playing);playing=null;$("play").textContent="▶";return;}
  let i=0;$("play").textContent="❚❚";const step=()=>{$("range").value=i;state.upto=DATES[i];refresh();if(++i>=DATES.length){clearInterval(playing);playing=null;$("play").textContent="▶";}};step();playing=setInterval(step,1500);};
$("impBtn").onclick=()=>{$("impMsg").textContent="";$("impMsg").className="";$("dlg").showModal();};
$("impCancel").onclick=()=>$("dlg").close();
function parseImport(){return $("impText").value.split(/\n+/).map(l=>l.trim()).filter(Boolean).map(l=>{
  let d="10月",sent=0;const m=/^(\d{1,2}\/\d{1,2})\s*/.exec(l);if(m){d=m[1];l=l.slice(m[0].length);}
  const s=/\s*(\+|-|＋|－|利多|利空)\s*$/.exec(l);if(s){sent=/\+|＋|利多/.test(s[1])?1:-1;l=l.slice(0,s.index);}
  return {d,t:l,s:"",src:"自行新增",u:"",sent,heat:3};});}
function doImport(mode){const add=parseImport();
  if(!add.length){$("impMsg").textContent="沒有讀到新聞，請一行貼一則。";$("impMsg").className="err";return;}
  const base=mode==="add"?EVENTS.map(({d,t,s,src,u,sent,heat})=>({d,t,s,src,u,sent,heat})):[];
  ingest([...base,...add]);keep={};
  const tc=themeCounts(),ts=Object.keys(tc).sort((p,q)=>tc[q]-tc[p]);
  if(!tc[state.A])state.A=ts[0]||state.A;if(!tc[state.B]||state.B===state.A)state.B=ts.find(t=>t!==state.A)||state.B;
  $("dlg").close();refresh();renderTicker();toast(`新增 ${add.length} 位醫師，收治 ${add.reduce((n,a)=>n+matchText(a.t,MATCH).codes.length,0)} 位病人`);}
$("impAdd").onclick=()=>doImport("add");$("impReplace").onclick=()=>doImport("replace");

$("taiex").innerHTML=TAIEX?`${TAIEX.close.toLocaleString()}　<span class="${TAIEX.chg>0?"up":TAIEX.chg<0?"down":"flat"}">${TAIEX.chg>0?"+":""}${(+TAIEX.chg).toFixed(2)}（${TAIEX.pct>0?"+":""}${(+TAIEX.pct).toFixed(2)}%）</span>`:"—";
$("asof").textContent=`${ASOF_MD} 收盤，資料更新 ${DATA_UPDATED||""}`;$("asof").title=DATA_NOTES.join("\n");$("plate").setAttribute("data-note",`${NEWS.length} 則新聞比對 ${Object.keys(UNI).length} 家上市櫃公司`);
ingest(NEWS);
// 平面圖尺寸改變（含頁面剛載入時版面尚未定型）就重新配置各棟位置並重新取景
let lastW=0,lastH=0,rt;
function relayout(first){resize();if(W<80||H<80)return;
  if(first||Math.abs(W-lastW)>30||Math.abs(H-lastH)>30){const v0=lastW&&(lastW<640)!==(W<640);lastW=W;lastH=H;keep={};build();resetView();
    if(first){cam.k=camT.k*.92;cam.x=camT.x;cam.y=camT.y;}if(state.sel){const n=nodeMap[state.sel.id];state.sel=n||null;openCard(state.sel);}}}
const ro=new ResizeObserver(()=>{clearTimeout(rt);rt=setTimeout(()=>relayout(false),100);});ro.observe(cv);
resize();R=analyse();relayout(true);render();renderTicker();requestAnimationFrame(draw);
</script>
